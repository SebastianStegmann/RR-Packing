<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salla Labels (v1.8) - Thermal Printer Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SheetJS for XLSX parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts Cairo for Arabic typography compatibility -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Cairo', sans-serif;
        }
        
        /* 4x6 Label Card Preview Style */
        .label-card {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 4 / 6;
            background: white;
            border: 2px dashed #cbd5e1;
            box-sizing: border-box;
        }

        /* Strict Thermal Print Page Rules for Safari / iPad */
        @media print {
            @page {
                size: 4in 6in;
                margin: 0 !important;
            }

            html, body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 4in !important;
                height: 6in !important;
                overflow: hidden !important;
            }

            body * {
                visibility: hidden !important;
            }
            
            #labels-container, #labels-container * {
                visibility: visible !important;
            }

            #labels-container {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 4in !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .printable-label {
                visibility: visible !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 4in !important;
                height: 6in !important;
                max-width: 4in !important;
                max-height: 6in !important;
                page-break-after: always !important;
                page-break-inside: avoid !important;
                break-after: page !important;
                break-inside: avoid !important;
                margin: 0 !important;
                padding: 0.25in !important;
                box-shadow: none !important;
                border: none !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                box-sizing: border-box !important;
                overflow: hidden !important;
            }

            /* Hide non-essential print metadata like counter and buttons */
            .print-hidden {
                display: none !important;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white shadow-md p-4 no-print">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🏷️</span>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-xl font-bold">Salla Labels (Phomemo PM-241BT)</h1>
                        <span class="bg-indigo-900 text-indigo-200 text-xs px-2 py-0.5 rounded-full font-mono font-bold">v1.8</span>
                    </div>
                    <p class="text-xs text-indigo-200">Convert Salla Excel orders to 4×6 thermal labels for Labelife</p>
                </div>
            </div>
            <div id="action-buttons" class="hidden flex gap-2">
                <button onclick="printAllLabels()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-semibold text-sm shadow transition flex items-center gap-2">
                    <span>🖨️</span> Print All (4×6)
                </button>
                <button onclick="resetApp()" class="bg-slate-600 hover:bg-slate-700 text-white px-3 py-2 rounded-xl text-sm transition">
                    New File
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-4 sm:p-6 flex-grow w-full">

        <!-- Upload Box -->
        <div id="upload-section" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center max-w-xl mx-auto my-12 no-print">
            <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                📂
            </div>
            <h2 class="text-xl font-bold mb-2">Upload Salla Orders (XLSX)</h2>
            <p class="text-sm text-slate-500 mb-6">Instantly generates exact 4×6 label cards optimized for your thermal printer workflow.</p>
            
            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg inline-flex items-center gap-2 transition">
                <span>Select Excel File</span>
                <input type="file" id="xlsx-file" accept=".xlsx, .xls" class="hidden" onchange="handleFileUpload(event)">
            </label>
        </div>

        <!-- Labels Preview Grid -->
        <div id="labels-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 justify-items-center">
            <!-- Dynamic labels inserted here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 no-print">
        Salla Labels App <span class="font-mono font-bold text-indigo-600">v1.8</span> • Optimized for iPad Safari & 4×6 Thermal Printers
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let parsedOrders = [];

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    parsedOrders = XLSX.utils.sheet_to_json(worksheet);
                    
                    if (parsedOrders.length === 0) {
                        alert('The uploaded file is empty or invalid.');
                        return;
                    }

                    document.getElementById('upload-section').classList.add('hidden');
                    document.getElementById('action-buttons').classList.remove('hidden');
                    renderLabels();
                } catch (error) {
                    console.error(error);
                    alert('Error reading the file. Please make sure it is a valid Salla export Excel file.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function parseProducts(productString) {
            if (!productString) return [];
            const regex = /\(SKU:\s*([^)]+)\)(.*?)\(Qty:\s*(\d+)\)/g;
            let match;
            let items = [];
            while ((match = regex.exec(productString)) !== null) {
                items.push({
                    sku: match[1].trim(),
                    name: match[2].trim().replace(/^['"]|['"]$/g, ''),
                    qty: match[3].trim()
                });
            }
            if (items.length === 0) {
                return [{ name: productString, sku: '-', qty: '1' }];
            }
            return items;
        }

        function renderLabels() {
            const container = document.getElementById('labels-container');
            container.innerHTML = '';

            parsedOrders.forEach((order, index) => {
                const customerName = order['Customer Name'] || 'Unknown Customer';
                const customerMobile = order['Customer Mobile'] || '';
                const city = order['City'] || '';
                const address = order['Customer Address'] || '';
                const orderId = order['Order ID'] || '';
                const rawProducts = order['Product Names with SKU'] || '';
                
                const products = parseProducts(rawProducts);

                const labelCard = document.createElement('div');
                labelCard.className = "printable-label label-card bg-white p-4 rounded-xl shadow-md flex flex-col justify-between border border-slate-300 relative text-left";
                
                let productsHtml = products.map(p => `
                    <div class="flex justify-between items-start border-b border-dashed border-slate-200 py-1 text-xs">
                        <div class="flex-grow pr-2">
                            <span class="font-bold text-slate-800" dir="auto">${p.name}</span>
                            <span class="text-slate-500 block text-[10px] font-mono">SKU: ${p.sku}</span>
                        </div>
                        <div class="bg-slate-100 px-2 py-0.5 rounded font-bold text-slate-700 text-xs whitespace-nowrap">
                            ×${p.qty}
                        </div>
                    </div>
                `).join('');

                labelCard.innerHTML = `
                    <div>
                        <!-- Top Header: Order ID & Royal Rabbit text -->
                        <div class="flex justify-between items-center border-b-2 border-slate-800 pb-2 mb-3">
                            <div class="font-black text-sm text-slate-900">📦 Order: #${orderId}</div>
                            <div class="font-extrabold text-sm text-slate-900 tracking-wide">ROYAL RABBIT</div>
                        </div>

                        <!-- Customer Info Box -->
                        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 mb-3 text-xs space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-slate-900 text-sm" dir="auto">${customerName}</span>
                                <span class="font-mono bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-bold" dir="ltr">${customerMobile}</span>
                            </div>
                            <div class="text-slate-600 font-semibold" dir="auto">📍 City: ${city}</div>
                            <div class="text-slate-500 text-[11px] leading-tight truncate" dir="auto">Address: ${address}</div>
                        </div>

                        <!-- Products Header -->
                        <div class="text-xs font-bold text-slate-700 mb-1">Ordered Items:</div>
                        <div class="max-h-36 overflow-y-auto pl-1 space-y-1">
                            ${productsHtml}
                        </div>
                    </div>

                    <!-- Bottom Bar (Hidden when printing) -->
                    <div class="print-hidden pt-2 border-t border-slate-200 flex justify-between items-center text-[10px] text-slate-400">
                        <span>Label (${index + 1} of ${parsedOrders.length})</span>
                        <button onclick="printSingleLabel(${index})" class="no-print bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded font-bold text-xs transition">
                            🖨️ Print Label
                        </button>
                    </div>
                `;

                container.appendChild(labelCard);
            });
        }

        function printSingleLabel(index) {
            const cards = document.querySelectorAll('.printable-label');
            cards.forEach((card, i) => {
                if (i === index) {
                    card.style.display = 'flex';
                    card.style.visibility = 'visible';
                } else {
                    card.style.display = 'none';
                    card.style.visibility = 'hidden';
                }
            });
            window.print();
            setTimeout(() => {
                cards.forEach(card => {
                    card.style.display = 'flex';
                    card.style.visibility = 'visible';
                });
            }, 500);
        }

        function printAllLabels() {
            const cards = document.querySelectorAll('.printable-label');
            cards.forEach(card => {
                card.style.display = 'flex';
                card.style.visibility = 'visible';
            });
            window.print();
        }

        function resetApp() {
            parsedOrders = [];
            document.getElementById('labels-container').innerHTML = '';
            document.getElementById('upload-section').classList.remove('hidden');
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('xlsx-file').value = '';
        }
    </script>
</body>
</html>
